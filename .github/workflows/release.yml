name: Release

on:
  push:
    tags: ["v*"]
    branches: ["main"]

permissions:
  contents: write

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

  build-executable:
    name: Build executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: oss-sanitizer-linux-x86_64
          - os: windows-latest
            artifact: oss-sanitizer-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build executable
        run: >
          uv run pyinstaller
          --onefile
          --name ${{ matrix.artifact }}
          --add-data "public_domains_allowlist.yaml:."
          --add-data "src/oss_sanitizer/templates:oss_sanitizer/templates"
          --hidden-import detect_secrets.plugins.artifactory
          --hidden-import detect_secrets.plugins.aws
          --hidden-import detect_secrets.plugins.azure_storage_key
          --hidden-import detect_secrets.plugins.basic_auth
          --hidden-import detect_secrets.plugins.github_token
          --hidden-import detect_secrets.plugins.gitlab_token
          --hidden-import detect_secrets.plugins.high_entropy_strings
          --hidden-import detect_secrets.plugins.jwt
          --hidden-import detect_secrets.plugins.keyword
          --hidden-import detect_secrets.plugins.private_key
          --hidden-import detect_secrets.plugins.slack
          --hidden-import tldextract
          --collect-data tldextract
          build_entry.py

      - name: Smoke test
        run: dist/${{ matrix.artifact }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  build-bundle:
    name: Build wheelhouse bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            bundle: oss-sanitizer-bundle-linux.zip
          - os: windows-latest
            bundle: oss-sanitizer-bundle-windows.zip

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Build project wheel
        run: uv build --wheel --out-dir wheelhouse/

      - name: Download core runtime dependency wheels
        # openai/anthropic (LLM deps) are excluded — --llm is off by default and
        # their transitive trees are too large for CI runners.
        run: >
          uv run pip download --dest wheelhouse/ --only-binary=:all:
          "gitpython>=3.1"
          "pyyaml>=6.0"
          "rich>=13.0"
          "tldextract>=5.3.1"
          "jinja2>=3.1.6"
          "detect-secrets>=1.5.0"

      - name: Zip wheelhouse (Linux)
        if: runner.os == 'Linux'
        run: cd wheelhouse && zip -r ../${{ matrix.bundle }} .

      - name: Zip wheelhouse (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path wheelhouse\* -DestinationPath ${{ matrix.bundle }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}
          path: ${{ matrix.bundle }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, build-executable, build-bundle]

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "tag=main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/**/*
